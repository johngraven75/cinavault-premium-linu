name: Linux Validation

# Pull-request and main validation for the Debian/Linux (Zorin OS) edition:
# preventive gate, type check, tests, frontend build, Rust, and a .deb build.
# Adapted from the Windows reference repository's validation workflow.
# While the application source has not yet been ported, the gate step below
# detects an empty scaffold and passes without running product steps.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Preventive Gate, Type, Test, Frontend, Rust, and .deb build
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect product source
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json yet — repository is in the scaffolding phase. Skipping product validation."
          fi

      - name: Setup Node
        if: steps.detect.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri Linux prerequisites
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            build-essential curl file

      - name: Install frontend dependencies
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: npm ci

      - name: TypeScript validation
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: npm run lint

      - name: Test suite
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: npm test

      - name: Production frontend build
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: npm run build

      - name: Setup Rust
        if: steps.detect.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust tests and native validation
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build .deb package
        if: steps.detect.outputs.ready == 'true'
        shell: bash
        run: npm run tauri:build:linux

      - name: Upload .deb artifact
        if: steps.detect.outputs.ready == 'true' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-premium-linux-deb-${{ github.sha }}
          path: src-tauri/target/**/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 30
