name: Linux Package and Release

# Builds and publishes the Debian/Linux (.deb) release for Zorin OS / Ubuntu / Debian.
# Replaces the Windows reference repository's installer + release workflows.
#
# A release is cut by committing a trigger file under .github/release-triggers/
# to main (the same mechanism the Windows edition uses), or by a manual run.
# Package signing turns on automatically once the GPG signing key is configured
# (see docs/PACKAGE_SIGNING.md); until then the .deb is published unsigned.

on:
  push:
    branches: [main]
    paths:
      - ".github/release-triggers/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0-linux-beta)"
        required: false

permissions:
  contents: write

concurrency:
  group: linux-package-release
  cancel-in-progress: false

jobs:
  package:
    name: Build .deb and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard — product source present
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::No product source yet; cannot build a release from the scaffold."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri Linux prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            build-essential curl file

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Restore offline vision model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: public/models
          key: vision-model-${{ hashFiles('scripts/fetch-ai-models.mjs') }}

      - name: Fetch offline vision model
        shell: bash
        run: npm run fetch:ai-models

      - name: Validate before packaging
        shell: bash
        run: |
          set -o pipefail
          npm run lint
          npm test
          npm run build

      - name: Build .deb package
        id: build
        shell: bash
        run: npm run tauri:build:linux

      - name: Sign .deb when a signing key is configured
        id: sign
        env:
          DEB_GPG_PRIVATE_KEY: ${{ secrets.DEB_GPG_PRIVATE_KEY }}
          DEB_GPG_PASSPHRASE: ${{ secrets.DEB_GPG_PASSPHRASE }}
          DEB_GPG_KEY_ID: ${{ vars.DEB_GPG_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEB_GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::No DEB_GPG_PRIVATE_KEY configured — publishing unsigned .deb (see docs/PACKAGE_SIGNING.md)."
            exit 0
          fi
          sudo apt-get install -y dpkg-sig
          echo "$DEB_GPG_PRIVATE_KEY" | gpg --batch --import
          find src-tauri/target -name '*.deb' -path '*/bundle/deb/*' -print0 | while IFS= read -r -d '' deb; do
            dpkg-sig --sign builder -k "$DEB_GPG_KEY_ID" "$deb"
          done

      - name: Compute checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-staging
          find src-tauri/target -name '*.deb' -path '*/bundle/deb/*' -exec cp {} release-staging/ \;
          cd release-staging
          sha256sum *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(basename "$(ls -1 .github/release-triggers/ | grep -v '^\.' | head -n1)")"
          fi
          [ -n "$TAG" ] || { echo "::error::No release tag resolved."; exit 1; }
          gh release create "$TAG" release-staging/*.deb release-staging/SHA256SUMS.txt \
            --title "$TAG" \
            --notes "CinaVault Premium Linux edition — $TAG. See CHANGELOG.md." \
            --prerelease
